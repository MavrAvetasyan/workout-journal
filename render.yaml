databases:
  - name: workout-journal-db
    plan: free
    databaseName: workout_journal
    user: workout_journal

services:
  - type: web
    name: workout-journal
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: workout-journal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
